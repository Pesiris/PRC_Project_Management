<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PR Corporation SA — Painel de Gestão de Projectos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --ink:#1a2332; --ink-soft:#475069; --line:#dfe3ec; --line-soft:#eef0f5;
  --bg:#f6f7f9; --panel:#ffffff; --brand:#1f3a5f; --brand-2:#2d5a8c;
  --crit:#b3261e; --crit-bg:#fdeceb; --warn:#9a6700; --warn-bg:#fdf5e3;
  --ok:#1a7f54; --ok-bg:#e7f4ee; --block:#7a3ea8; --block-bg:#f3ebfa;
  --idle:#5a6478; --idle-bg:#eef0f5;
  --accent:#c8862e;
  --r:10px; --r-sm:7px; --sh:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
  --mono:'SF Mono',ui-monospace,'Cascadia Mono','Roboto Mono',monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap');

/* ---- Topbar ---- */
.topbar{background:var(--brand);color:#fff;padding:0 22px;height:60px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:'Fraunces',serif;font-weight:600;font-size:19px;letter-spacing:.2px}
.brand span{font-size:11px;color:#a9c0dc;text-transform:uppercase;letter-spacing:1.5px}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{background:none;border:0;color:#bcd0e6;padding:8px 15px;border-radius:var(--r-sm);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.tab:hover{background:rgba(255,255,255,.08);color:#fff}
.tab.on{background:#fff;color:var(--brand);font-weight:600}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.scope-tag{font-size:11px;color:#a9c0dc;border:1px solid rgba(255,255,255,.2);padding:3px 9px;border-radius:20px}
.sync-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#cfe0f0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);padding:5px 11px;border-radius:20px;cursor:pointer;font-family:inherit;transition:.15s}
.sync-badge:hover{background:rgba(255,255,255,.16)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#8aa0b6}
.sync-off .sync-dot{background:#8aa0b6}
.sync-ok .sync-dot{background:#3ecf8e;box-shadow:0 0 0 3px rgba(62,207,142,.25)}
.sync-syncing .sync-dot{background:#f5c451;animation:pulse 1s infinite}
.sync-error .sync-dot{background:#ff6b6b;box-shadow:0 0 0 3px rgba(255,107,107,.25)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.cloud-steps{counter-reset:step;margin:0 0 4px}
.cloud-steps li{list-style:none;position:relative;padding:0 0 14px 34px;font-size:13px;color:var(--ink-soft);line-height:1.55}
.cloud-steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;width:23px;height:23px;background:var(--brand);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.cloud-steps li b{color:var(--ink)}
.cloud-steps a{color:var(--brand-2)}
.cloud-status{padding:10px 12px;border-radius:8px;font-size:12px;margin-top:6px}
.cloud-status.ok{background:var(--ok-bg);color:var(--ok)}
.cloud-status.err{background:var(--crit-bg);color:var(--crit)}
.cloud-status.info{background:#eef3f8;color:var(--brand-2)}

/* ---- Buttons ---- */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:var(--r-sm);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c2c9d6;background:#fafbfc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{border-color:transparent;background:rgba(255,255,255,.1);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.18)}
.btn.danger{color:var(--crit);border-color:#f0c9c6}
.btn.danger:hover{background:var(--crit-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11px}

/* ---- Layout ---- */
.wrap{max-width:1320px;margin:0 auto;padding:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.page-head h1{font-family:'Fraunces',serif;font-weight:600;font-size:25px;letter-spacing:-.2px}
.page-head p{color:var(--ink-soft);font-size:13px;margin-top:2px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}

/* ---- KPI cards ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);font-weight:600}
.kpi .num{font-size:34px;font-weight:700;font-family:'Fraunces',serif;line-height:1.1;margin-top:6px}
.kpi .sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi.c-crit .bar{background:var(--crit)} .kpi.c-crit .num{color:var(--crit)}
.kpi.c-exec .bar{background:var(--brand-2)} .kpi.c-exec .num{color:var(--brand-2)}
.kpi.c-ok .bar{background:var(--ok)} .kpi.c-ok .num{color:var(--ok)}
.kpi.c-warn .bar{background:var(--warn)} .kpi.c-warn .num{color:var(--warn)}

/* ---- Section headers ---- */
.sec{margin-bottom:22px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.sec-head h2{font-size:15px;font-weight:600}
.sec-head .count{background:var(--line-soft);color:var(--ink-soft);font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}

/* ---- Badges ---- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.b-crit{background:var(--crit-bg);color:var(--crit)}
.b-exec{background:#e8eff6;color:var(--brand-2)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-block{background:var(--block-bg);color:var(--block)}
.b-idle{background:var(--idle-bg);color:var(--idle)}
.b-late{background:var(--warn-bg);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ---- Tables ---- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfcfd}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:.1s}
tbody tr:hover{background:#fafbfc}
.t-title{font-weight:600;color:var(--ink)}
.t-meta{font-size:12px;color:var(--ink-soft)}
.prio-chip{font-family:var(--mono);font-size:11px;font-weight:700;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;background:var(--line-soft);color:var(--ink)}
.prio-chip.p1{background:#fde7e6;color:var(--crit)}
.prio-chip.p2{background:var(--warn-bg);color:var(--warn)}

/* ---- Project grid ---- */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.proj-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:.15s}
.proj-card:hover{border-color:#c2c9d6;transform:translateY(-1px);box-shadow:0 4px 18px rgba(20,30,50,.1)}
.proj-card .pc-top{padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.proj-card h3{font-size:16px;font-weight:600}
.proj-card .pc-grp{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.proj-card .pc-body{padding:14px 16px}
.proj-card .pc-scope{font-size:12px;color:var(--ink-soft);margin-bottom:12px;min-height:32px}
.progress{height:6px;background:var(--line-soft);border-radius:20px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:20px;transition:.4s}
.pc-stats{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--ink-soft)}
.pc-foot{padding:10px 16px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between}

/* ---- Modal ---- */
.overlay{position:fixed;inset:0;background:rgba(20,30,50,.45);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease}
.modal.wide{max-width:920px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
.modal-head .x{border:0;background:none;font-size:22px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px}
.modal-head .x:hover{background:var(--line-soft)}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fbfcfd;border-radius:0 0 14px 14px}

/* ---- Forms ---- */
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(45,90,140,.12)}
.field textarea{resize:vertical;min-height:64px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frow-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{width:auto}

/* ---- Detail / log ---- */
.detail-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.dm{background:#fbfcfd;border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:10px 12px}
.dm .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);font-weight:600}
.dm .v{font-size:14px;font-weight:600;margin-top:3px}
.log{border-left:2px solid var(--line);padding-left:16px;margin-top:6px}
.log-item{position:relative;padding-bottom:14px}
.log-item::before{content:'';position:absolute;left:-21px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--brand-2);border:2px solid #fff}
.log-item .when{font-size:11px;color:var(--ink-soft);font-family:var(--mono)}
.log-item .what{font-size:13px;margin-top:1px}
.log-empty{color:var(--ink-soft);font-size:13px;font-style:italic}

/* ---- Filters ---- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input[type=search]{padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;font-size:13px;min-width:220px}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;font-size:13px;background:#fff}
.spacer{flex:1}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.empty-state h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.loading{text-align:center;padding:80px;color:var(--ink-soft)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s}
.inline-edit-row td{background:#fbfcfd}

/* ---- People ---- */
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.person-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;cursor:pointer;transition:.15s;display:flex;gap:13px;align-items:flex-start}
.person-card:hover{border-color:#c2c9d6;transform:translateY(-1px);box-shadow:0 4px 18px rgba(20,30,50,.1)}
.person-card.inactive{opacity:.6}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;background:var(--brand-2);font-family:var(--mono)}
.avatar.lg{width:64px;height:64px;font-size:20px}
.person-card .pi-name{font-weight:600;font-size:14px}
.person-card .pi-role{font-size:12px;color:var(--ink-soft);margin-top:1px}
.person-card .pi-meta{font-size:11px;color:var(--ink-soft);margin-top:7px;display:flex;flex-wrap:wrap;gap:8px}
.person-head{display:flex;gap:18px;align-items:center;margin-bottom:20px}
.team-chips{display:flex;flex-wrap:wrap;gap:8px}
.team-chip{display:inline-flex;align-items:center;gap:7px;background:#fbfcfd;border:1px solid var(--line);border-radius:24px;padding:4px 12px 4px 4px;font-size:12px;font-weight:500;cursor:pointer;transition:.12s}
.team-chip:hover{border-color:#c2c9d6;background:#fff}
.team-chip .avatar{width:26px;height:26px;font-size:10px}
.team-chip.note{cursor:default;color:var(--ink-soft);padding:5px 12px;font-style:italic}
.team-chip.note:hover{border-color:var(--line);background:#fbfcfd}

@media(max-width:720px){
  .tabs{display:none}
  .frow,.frow-3{grid-template-columns:1fr}
  .wrap{padding:14px}
}
/* ---- Ecrã de bloqueio ---- */
.lock{position:fixed;inset:0;background:linear-gradient(135deg,#1f3a5f,#15273f);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.lock-card{background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.4);width:100%;max-width:380px;padding:36px 34px;text-align:center;animation:pop .25s ease}
.lock-card .lk-brand{font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:#1f3a5f}
.lock-card .lk-sub{font-size:11px;color:#98a2b3;text-transform:uppercase;letter-spacing:2px;margin-bottom:24px}
.lock-card .lk-lock{width:48px;height:48px;margin:0 auto 16px;border-radius:50%;background:#e8eff6;display:flex;align-items:center;justify-content:center;font-size:22px}
.lock-card label{display:block;text-align:left;font-size:12px;font-weight:600;color:#475069;margin:0 0 5px}
.lock-card input{width:100%;padding:11px 13px;border:1px solid #dfe3ec;border-radius:8px;font-size:14px;margin-bottom:14px;font-family:inherit}
.lock-card input:focus{outline:0;border-color:#2d5a8c;box-shadow:0 0 0 3px rgba(45,90,140,.12)}
.lock-card button{width:100%;padding:12px;background:#1f3a5f;color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.lock-card button:hover{background:#2d5a8c}
.lock-err{background:#fdeceb;color:#b3261e;font-size:12px;padding:9px;border-radius:7px;margin-bottom:14px;display:none}
.lock-err.show{display:block}
</style>
</head>

<div id="app"><div class="loading">A carregar o painel…</div></div>
<script>
/* ============================================================
   PR CORPORATION SA — Painel de Gestão de Projectos
   Armazenamento local (localStorage) + sincronização automática
   na nuvem via Gist privado do GitHub. Funciona em qualquer
   dispositivo e offline; sincroniza quando há ligação.
   ============================================================ */
const SHARED = false;
const K_PROJ = "tc:projects";
const K_ACT  = "tc:actions";
const K_LOG  = "tc:log";
const K_PPL  = "tc:people";
const K_CFG  = "tc:cloudcfg";   // {token, gistId} guardado só neste dispositivo
const K_REV  = "tc:rev";        // carimbo da última gravação (para resolver conflitos)
const GIST_FILE = "trustcapital_data.json";
let cloud = { token:"", gistId:"" };   // configuração de nuvem (por dispositivo)
let syncState = "off";                  // off | ok | syncing | error
let syncMsg = "Sincronização desligada";

/* ============================================================
   ACESSO — palavra-passe pedida sempre que a app abre.
   Guardamos só o "hash" (impressão digital) das credenciais,
   nunca a password em texto. Para MUDAR as credenciais:
     1. Defina o novo user/password.
     2. Gere o novo hash (ver instruções no Guia).
     3. Substitua o valor de AUTH_HASH abaixo.
   Credenciais iniciais (MUDE-AS depois):
     Utilizador:  jlouro
     Palavra-passe: Gorongosa-5827-zambeze
   ============================================================ */
const AUTH_SALT = "tc_v1_";
const AUTH_HASH = "e811a4fafc71eb6063433bb0aed8d38d8d0d75fb4df8f5bfe2ae9155b8349cc6";
async function sha256(txt){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function checkCredentials(user,pass){
  const h=await sha256(AUTH_SALT+user.trim()+":"+pass);
  return h===AUTH_HASH;
}
function showLogin(){
  const app=document.getElementById("app");
  app.innerHTML=`<div class="lock"><div class="lock-card">
    <div class="lk-lock">🔒</div>
    <div class="lk-brand">PR Corporation SA</div>
    <div class="lk-sub">Action Plan</div>
    <div class="lock-err" id="lk-err">Credenciais incorrectas. Tente de novo.</div>
    <label>Utilizador</label>
    <input id="lk-user" autocomplete="username" autofocus>
    <label>Palavra-passe</label>
    <input id="lk-pass" type="password" autocomplete="current-password">
    <button id="lk-btn">Entrar</button>
  </div></div>`;
  const tryLogin=async()=>{
    const u=document.getElementById("lk-user").value;
    const p=document.getElementById("lk-pass").value;
    if(await checkCredentials(u,p)){ sessionStorage.setItem("tc:auth","1"); boot(); }
    else { document.getElementById("lk-err").classList.add("show"); document.getElementById("lk-pass").value=""; document.getElementById("lk-pass").focus(); }
  };
  document.getElementById("lk-btn").onclick=tryLogin;
  document.getElementById("lk-pass").addEventListener("keydown",e=>{ if(e.key==="Enter") tryLogin(); });
  document.getElementById("lk-user").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("lk-pass").focus(); });
}

const STATUS = {
  nao_iniciado:{label:"Não iniciado",cls:"b-idle"},
  em_execucao:{label:"Em execução",cls:"b-exec"},
  bloqueado:{label:"Bloqueado",cls:"b-block"},
  concluido:{label:"Concluído",cls:"b-ok"},
};
const GRUPOS = ["O&G","Industria","Renewable","Fuel","Logistics","Boroma & Lupata","Mining","IT & Financial Services"];
const ESTADOS_PESSOA = {ativo:"Activo", inativo:"Inactivo"};

/* ---------- SEED PESSOAS (a partir da matriz) ---------- */
const SEED_PEOPLE = [
  {id:"u_pr", name:"Paulo Ratilal", initials:"PR", role:"", company:"", area:"", email:"", phone:"", status:"ativo", notes:""},
  {id:"u_eddy", name:"Eddy + Mackie", initials:"Mck", role:"", company:"", area:"", email:"", phone:"", status:"ativo", notes:"Registo combinado da matriz original — pode separar em duas fichas."},
  {id:"u_sergio", name:"Sergio", initials:"S", role:"", company:"", area:"", email:"", phone:"", status:"ativo", notes:""},
  {id:"u_jiva", name:"Jivá", initials:"", role:"", company:"", area:"", email:"", phone:"", status:"ativo", notes:""},
  {id:"u_rsg", name:"RSG", initials:"R", role:"", company:"", area:"", email:"", phone:"", status:"ativo", notes:""},
  {id:"u_mucave", name:"Mucave (Moz Indico)", initials:"", role:"", company:"Moz Indico", area:"", email:"", phone:"", status:"ativo", notes:""},

let projects=[], actions=[], logEntries=[], people=[], view="dashboard", openProjectId=null, openPersonId=null;

/* ---------- STORAGE (local, via localStorage) ---------- */
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

async function loadAll(){
  // 1) Carrega config de nuvem deste dispositivo
  try{ const c=safeGet(K_CFG); if(c) cloud=JSON.parse(c); }catch(e){}
  // 2) Carrega o que houver localmente
  loadLocal();
  // 3) Se houver nuvem configurada, tenta puxar a versão mais recente
  if(cloud.token && cloud.gistId){
    await cloudPull(true);
  } else {
    syncState="off"; syncMsg="Sincronização desligada";
  }
}
function loadLocal(){
  try{
    const p = safeGet(K_PROJ);
    if(p){
      projects=JSON.parse(p); actions=JSON.parse(safeGet(K_ACT)||"[]"); logEntries=JSON.parse(safeGet(K_LOG)||"[]");
      const pp = safeGet(K_PPL);
      people = pp ? JSON.parse(pp) : SEED_PEOPLE.slice();
      migrateActions(); migrateProjects();
      if(!pp) persistLocal();
    }
    else { projects=SEED_PROJECTS.slice(); actions=SEED_ACTIONS.slice(); people=SEED_PEOPLE.slice(); logEntries=[];
      migrateProjects();
      logEntries.push({ts:new Date().toISOString(),entity:"Sistema",what:"Importação inicial da matriz de Outubro 2025 ("+projects.length+" projectos, "+actions.length+" acções, "+people.length+" pessoas).",refId:""});
      persistLocal(); }
  }catch(e){ projects=SEED_PROJECTS.slice(); actions=SEED_ACTIONS.slice(); people=SEED_PEOPLE.slice(); logEntries=[]; migrateProjects(); }
}
// Resolve uma pessoa a partir de um token de texto (iniciais ou nome)
function personByToken(tok){
  tok=(tok||"").trim(); if(!tok||tok==="—") return null;
  let m=people.find(u=>u.initials && u.initials.toLowerCase()===tok.toLowerCase());
  if(m) return m;
  m=people.find(u=>u.name.toLowerCase()===tok.toLowerCase());
  if(m) return m;
  return people.find(u=>u.name.toLowerCase().startsWith(tok.toLowerCase())) || null;
}
// Converte dados antigos (owner/support em texto) para ownerId/supportIds
function migrateActions(){
  let changed=false;
  actions.forEach(a=>{
    if(a.ownerId===undefined){
      const m=people.find(u=>u.name===a.owner); a.ownerId=m?m.id:""; changed=true; delete a.owner;
    }
    if(a.supportIds===undefined){
      const m=people.find(u=>u.name===a.support); a.supportIds=m?[m.id]:[]; changed=true; delete a.support;
    }
  });
  return changed;
}
// Converte lead/support de texto para leadId + memberIds, preservando só o texto não reconhecido
function migrateProjects(){
  let changed=false;
  projects.forEach(p=>{
    if(p.leadId===undefined){
      changed=true;
      const ids=[]; const unmatched=[];
      const consume=str=>String(str||"").split(/[+\/,]/).map(t=>t.replace(/[()?]/g,"").trim()).filter(t=>t&&t!=="—")
        .forEach(t=>{ const u=personByToken(t); if(u){ if(!ids.includes(u.id)) ids.push(u.id);} else if(!unmatched.includes(t)) unmatched.push(t); });
      consume(p.lead); consume(p.support);
      p.leadId = ids[0]||"";
      p.memberIds = ids.slice(1);
      p.teamNote = unmatched.join(", ");
      delete p.lead; delete p.support;
    }
  });
  return changed;
}

/* ---------- PERSISTÊNCIA (local + nuvem) ---------- */
function persistLocal(){
  safeSet(K_PROJ,JSON.stringify(projects));
  safeSet(K_ACT,JSON.stringify(actions));
  safeSet(K_PPL,JSON.stringify(people));
  safeSet(K_LOG,JSON.stringify(logEntries.slice(-500)));
}
// Grava localmente e, se houver nuvem, empurra para o Gist (com debounce)
let pushTimer=null;
function persist(){
  const rev=Date.now(); safeSet(K_REV,String(rev));
  persistLocal();
  if(cloud.token && cloud.gistId){
    clearTimeout(pushTimer);
    pushTimer=setTimeout(()=>cloudPush(rev), 1200); // agrupa gravações próximas
  }
}
async function pushLog(entity,what,refId){
  logEntries.push({ts:new Date().toISOString(),entity,what,refId});
}

/* ---------- SINCRONIZAÇÃO COM GIST ---------- */
function snapshot(){
  return { rev:Number(safeGet(K_REV)||0), projects, actions, people, logEntries:logEntries.slice(-500) };
}
function applySnapshot(d){
  projects = d.projects||[]; actions = d.actions||[]; people = d.people||[]; logEntries = d.logEntries||[];
  migrateActions(); migrateProjects(); persistLocal();
}
function setSync(state,msg){ syncState=state; syncMsg=msg; updateSyncBadge(); }

async function cloudPull(initial){
  if(!cloud.token||!cloud.gistId){ setSync("off","Sincronização desligada"); return; }
  setSync("syncing","A obter da nuvem…");
  try{
    const r=await fetch("https://api.github.com/gists/"+cloud.gistId,{
      headers:{ "Authorization":"Bearer "+cloud.token, "Accept":"application/vnd.github+json" }
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    const g=await r.json();
    const f=g.files && g.files[GIST_FILE];
    if(f && f.content){
      const remote=JSON.parse(f.content);
      const localRev=Number(safeGet(K_REV)||0);
      const remoteRev=Number(remote.rev||0);
      // A versão mais recente (maior rev) ganha
      if(remoteRev>=localRev){ applySnapshot(remote); setSync("ok","Sincronizado (nuvem mais recente)"); if(!initial) render(); }
      else { setSync("ok","Sincronizado (local mais recente)"); await cloudPush(localRev); }
    } else {
      // Gist existe mas sem o ficheiro: envia o local
      await cloudPush(Number(safeGet(K_REV)||Date.now()));
    }
  }catch(e){ setSync("error","Erro ao sincronizar: "+e.message); }
}
async function cloudPush(rev){
  if(!cloud.token||!cloud.gistId){ return; }
  setSync("syncing","A guardar na nuvem…");
  try{
    const body={ files:{ [GIST_FILE]:{ content:JSON.stringify(Object.assign(snapshot(),{rev})) } } };
    const r=await fetch("https://api.github.com/gists/"+cloud.gistId,{
      method:"PATCH",
      headers:{ "Authorization":"Bearer "+cloud.token, "Accept":"application/vnd.github+json", "Content-Type":"application/json" },
      body:JSON.stringify(body)
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    setSync("ok","Sincronizado · "+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ setSync("error","Erro ao guardar: "+e.message); }
}
// Cria um Gist novo a partir do estado actual e guarda o id
async function cloudCreateGist(token){
  const body={ description:"PR Corporation SA — dados do painel (privado)", public:false,
    files:{ [GIST_FILE]:{ content:JSON.stringify(Object.assign(snapshot(),{rev:Date.now()})) } } };
  const r=await fetch("https://api.github.com/gists",{
    method:"POST",
    headers:{ "Authorization":"Bearer "+token, "Accept":"application/vnd.github+json", "Content-Type":"application/json" },
    body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error("HTTP "+r.status+" — verifique o token e a permissão 'gist'");
  const g=await r.json();
  return g.id;
}

/* ---------- DERIVED ---------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function isLate(a){ return a.deadline && a.status!=="concluido" && a.deadline < todayISO(); }
function projActions(pid){ return actions.filter(a=>a.projectId===pid); }
function projProgress(pid){ const as=projActions(pid); if(!as.length) return 0; return Math.round(as.filter(a=>a.status==="concluido").length/as.length*100); }
function projName(pid){ const p=projects.find(x=>x.id===pid); return p?p.name:"—"; }
function uid(pre){ return pre+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3); }
function person(id){ return people.find(u=>u.id===id)||null; }
function personName(id){ const u=person(id); return u?u.name:""; }
function personActions(uid){ return actions.filter(a=>a.ownerId===uid || (a.supportIds||[]).includes(uid)); }
function activePeople(){ return people.filter(u=>u.status==="ativo").sort((a,b)=>a.name.localeCompare(b.name)); }
function projLeadName(p){ return personName(p.leadId)||""; }
function projMemberNames(p){ return (p.memberIds||[]).map(personName).filter(Boolean); }
function projTeamText(p){ const names=projMemberNames(p); const extra=p.teamNote?[p.teamNote]:[]; return names.concat(extra).join(", "); }

/* ---------- HELPERS ---------- */
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function statusBadge(a){
  const s=STATUS[a.status]; let html=`<span class="badge ${s.cls}"><span class="dot" style="background:currentColor"></span>${s.label}</span>`;
  if(isLate(a)) html+=` <span class="badge b-late">Atrasada</span>`;
  if(a.critico && a.status!=="concluido") html+=` <span class="badge b-crit">Crítica</span>`;
  return html;
}
let toastT;
function toast(msg){ const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el); clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2600); }
function ownerName(a){ return personName(a.ownerId)||""; }
function supportNames(a){ return (a.supportIds||[]).map(personName).filter(Boolean).join(", "); }
function ownerSupportText(a){ const o=ownerName(a), s=supportNames(a); return o+(s?(o?" · apoio: ":"apoio: ")+s:""); }

  }</div>`;
  bindGlobal();
}
function topbar(){

function actionRows(arr){

  return arr.slice().sort((a,b)=>(a.priority||9)-(b.priority||9)).map(a=>`<tr>

function applyActionFilters(){
  const q=(document.getElementById("f-search").value||"").toLowerCase();

  const cr=document.getElementById("f-crit").checked;

async function savePerson(id){
  const v=k=>document.getElementById(k).value.trim();
  const name=v("mp-name"); if(!name){toast("Indique o nome.");return;}
  const data={name,initials:v("mp-initials"),role:v("mp-role"),company:v("mp-company"),area:v("mp-area"),email:v("mp-email"),phone:v("mp-phone"),status:document.getElementById("mp-status").value,notes:v("mp-notes")};
  if(id){ const u=person(id); const changes=diffPerson(u,data); Object.assign(u,data);
    pushLog("Pessoa · "+name, changes.length?("Editada: "+changes.join("; ")):"Guardada sem alterações.", id); toast("Ficha actualizada."); }
  else { const nu={id:uid("u_"),...data}; people.push(nu);
    pushLog("Pessoa · "+name,"Ficha criada.",nu.id); openPersonId=nu.id; view="people"; toast("Ficha criada."); }
  closeModal(); render(); persist();
}
async function deletePerson(id){
  const u=person(id);
  const refs=personActions(id).length;
  const projRefs=projects.filter(p=>p.leadId===id||(p.memberIds||[]).includes(id)).length;
  const total=refs+projRefs;
  if(total && !confirm(`${u.name} está ligado a ${refs} acção(ões) e ${projRefs} projecto(s). Ao apagar, será removido de todos. Continuar?`)) return;
  if(!total && !confirm(`Apagar a ficha de ${u.name}?`)) return;
  actions.forEach(a=>{ if(a.ownerId===id) a.ownerId=""; a.supportIds=(a.supportIds||[]).filter(x=>x!==id); });
  projects.forEach(p=>{ if(p.leadId===id) p.leadId=""; p.memberIds=(p.memberIds||[]).filter(x=>x!==id); });
  people=people.filter(x=>x.id!==id);
  pushLog("Pessoa · "+u.name,`Ficha apagada (estava em ${refs} acção(ões) e ${projRefs} projecto(s)).`,id);
  closeModal(); openPersonId=null; view="people"; render(); toast("Ficha apagada."); persist();
}
function diffPerson(o,n){
  const labels={name:"nome",initials:"iniciais",role:"função",company:"empresa",area:"área",email:"email",phone:"telefone",status:"estado",notes:"notas"};
  const out=[]; for(const k in labels){ let ov=o[k],nv=n[k];
    if(k==="status"){ ov=ESTADOS_PESSOA[ov]||ov; nv=ESTADOS_PESSOA[nv]||nv; }
    if((ov||"")!==(nv||"")) out.push(`${labels[k]}: «${ov||"—"}» → «${nv||"—"}»`); }
  return out;
}

async function saveProject(id){
  const v=k=>document.getElementById(k).value.trim();
  const name=v("m-name"); if(!name){toast("Indique o nome do projecto.");return;}
  const memSel=document.getElementById("m-members");
  const memberIds=memSel?Array.from(memSel.selectedOptions).map(o=>o.value):[];
  const data={name,grupo:document.getElementById("m-grupo").value,priority:+v("m-prio")||null,leadId:document.getElementById("m-lead").value,memberIds,teamNote:v("m-teamnote"),scope:v("m-scope"),notes:v("m-notes")};
  if(id){ const p=projects.find(x=>x.id===id); const changes=diffProject(p,data); Object.assign(p,data);
    pushLog("Projecto · "+name, changes.length?("Editado: "+changes.join("; ")):"Guardado sem alterações.", id);
    toast("Projecto actualizado."); }
  else { const np={id:uid("p_"),...data}; projects.push(np);
    pushLog("Projecto · "+name,"Projecto criado.",np.id); openProjectId=np.id; view="projects"; toast("Projecto criado."); }
  closeModal(); render(); persist();
}
function diffProject(o,n){
  const labels={name:"nome",grupo:"grupo",priority:"prioridade",leadId:"lead",memberIds:"equipa",teamNote:"equipa (texto)",scope:"âmbito",notes:"notas"};
  const out=[]; for(const k in labels){ let ov=o[k],nv=n[k];
    if(k==="leadId"){ ov=personName(ov); nv=personName(nv); }
    if(k==="memberIds"){ ov=(ov||[]).map(personName).filter(Boolean).join(", "); nv=(nv||[]).map(personName).filter(Boolean).join(", "); }
    if((ov||"")!==(nv||"")) out.push(`${labels[k]}: «${ov||"—"}» → «${nv||"—"}»`); }
  return out;
}
async function deleteProject(id){
  const p=projects.find(x=>x.id===id); const n=projActions(id).length;
  if(!confirm(`Apagar "${p.name}" e as suas ${n} acção(ões)? Esta operação não pode ser anulada.`)) return;
  actions=actions.filter(a=>a.projectId!==id); projects=projects.filter(x=>x.id!==id);
  pushLog("Projecto · "+p.name,`Projecto e ${n} acção(ões) apagados.`,id);
  closeModal(); openProjectId=null; view="projects"; render(); toast("Projecto apagado."); persist();
}

/* ================= MODALS: ACTION ================= */

  showModal(`${isEdit?"Editar acção":"Nova acção"}`,`

    <div class="frow">
      <div class="field"><label>Projecto</label><select id="m-proj">${projects.map(p=>`<option value="${p.id}" ${a.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join("")}</select></div>
      <div class="field"><label>Estado</label><select id="m-status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${a.status===k?'selected':''}>${v.label}</option>`).join("")}</select></div>
    </div>
    <div class="frow">
      <div class="field"><label>Responsável</label><select id="m-owner"><option value="">— Sem responsável —</option>${activePeople().map(u=>`<option value="${u.id}" ${a.ownerId===u.id?'selected':''}>${esc(u.name)}${u.initials?' ('+esc(u.initials)+')':''}</option>`).join("")}</select></div>
      <div class="field"><label>Prioridade</label><select id="m-aprio"><option value="1" ${a.priority==1?'selected':''}>1 — Alta</option><option value="2" ${a.priority==2?'selected':''}>2 — Média</option><option value="3" ${a.priority==3?'selected':''}>3 — Baixa</option></select></div>
    </div>
    <div class="field"><label>Apoio (segure Ctrl/Cmd para escolher vários)</label>
      <select id="m-asupport" multiple size="4" style="height:auto">${activePeople().map(u=>`<option value="${u.id}" ${(a.supportIds||[]).includes(u.id)?'selected':''}>${esc(u.name)}${u.initials?' ('+esc(u.initials)+')':''}</option>`).join("")}</select></div>
    <div class="frow">
      <div class="field"><label>Data de início</label><input id="m-begin" type="date" value="${a.beginDate||''}"></div>
      <div class="field"><label>Prazo</label><input id="m-deadline" type="date" value="${a.deadline||''}"></div>
    </div>

  `,[
    isEdit?`<button class="btn danger" onclick="deleteAction('${a.id}')">Apagar acção</button>`:'',
    `<div class="spacer"></div>`,
    `<button class="btn" data-close>Cancelar</button>`,
    `<button class="btn primary" onclick="saveAction('${isEdit?a.id:''}')">${isEdit?'Guardar alterações':'Criar acção'}</button>`
  ]);
}
async function saveAction(id){
  const v=k=>document.getElementById(k).value, vt=k=>v(k).trim();
  const title=vt("m-title"); if(!title){toast("Indique o título da acção.");return;}
  const supSel=document.getElementById("m-asupport");
  const supportIds=supSel?Array.from(supSel.selectedOptions).map(o=>o.value):[];
  const data={title,projectId:v("m-proj"),status:v("m-status"),ownerId:v("m-owner"),supportIds,
    priority:+v("m-aprio"),beginDate:v("m-begin"),deadline:v("m-deadline"),critico:document.getElementById("m-crit").checked,notes:vt("m-anotes")};
  const pName=projName(data.projectId);
  if(id){ const a=actions.find(x=>x.id===id); const changes=diff(a,data,true); Object.assign(a,data);
    pushLog("Acção · "+pName, changes.length?(title+" — "+changes.join("; ")):(title+" — guardada."), id);
    toast("Acção actualizada."); }
  else { const na={id:uid("a_"),...data}; actions.push(na);
    pushLog("Acção · "+pName,"Criada: "+title,na.id); toast("Acção criada."); }
  closeModal(); render(); persist();
}
async function deleteAction(id){
  const a=actions.find(x=>x.id===id); if(!confirm(`Apagar a acção "${a.title}"?`)) return;
  const pName=projName(a.projectId); actions=actions.filter(x=>x.id!==id);
  pushLog("Acção · "+pName,"Apagada: "+a.title,a.projectId);
  closeModal(); render(); toast("Acção apagada."); persist();
}

/* diff for log */
function diff(oldO,newO,isAction){
  const labels=isAction?{title:"título",status:"estado",ownerId:"responsável",priority:"prioridade",deadline:"prazo",beginDate:"início",critico:"crítica",notes:"notas",supportIds:"apoio",projectId:"projecto"}:{name:"nome",grupo:"grupo",priority:"prioridade",lead:"lead",support:"apoio",scope:"âmbito",notes:"notas"};
  const out=[];
  for(const k in labels){
    let ov=oldO[k], nv=newO[k];
    if(k==="status"){ ov=STATUS[ov]?STATUS[ov].label:ov; nv=STATUS[nv]?STATUS[nv].label:nv; }
    if(k==="critico"){ ov=ov?"sim":"não"; nv=nv?"sim":"não"; }
    if(k==="ownerId"){ ov=personName(ov); nv=personName(nv); }
    if(k==="projectId"){ ov=projName(ov); nv=projName(nv); }
    if(k==="supportIds"){ ov=(ov||[]).map(personName).filter(Boolean).join(", "); nv=(nv||[]).map(personName).filter(Boolean).join(", "); }
    if((ov||"")!==(nv||"")) out.push(`${labels[k]}: «${ov||"—"}» → «${nv||"—"}»`);
  }
  return out;
}

/* ================= MODAL: NUVEM / SINCRONIZAÇÃO ================= */
function cloudModal(){
  const connected = !!(cloud.token && cloud.gistId);
  showModal("Sincronização na nuvem",`
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px">Sincronize os seus dados entre PC, portátil e telemóvel automaticamente, através de um <b>Gist privado do GitHub</b> (grátis e só seu). Configure uma vez por dispositivo.</p>
    ${connected?`<div class="cloud-status ok">✓ Ligado. ${esc(syncMsg)}</div>
      <div class="field" style="margin-top:14px"><label>ID do Gist (igual em todos os dispositivos)</label><input id="cl-gist" value="${esc(cloud.gistId)}" readonly></div>
      <p style="font-size:12px;color:var(--ink-soft)">Para ligar outro dispositivo: abra lá o painel, clique em Nuvem, escolha <b>"Já tenho um Gist"</b> e cole este ID + um token.</p>`
    :`<ol class="cloud-steps">
      <li>Abra <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">github.com/settings/tokens</a> e crie um <b>Fine-grained token</b> (ou clássico). Dê-lhe só a permissão <b>Gists: Read and write</b>.</li>
      <li>Copie o token (começa por <code>github_pat_</code> ou <code>ghp_</code>) e cole abaixo.</li>
      <li>Na primeira vez escolha <b>"Criar Gist novo"</b>. Nos outros dispositivos use <b>"Já tenho um Gist"</b> e cole o ID.</li>
    </ol>
    <div class="field"><label>Token de acesso do GitHub</label><input id="cl-token" type="password" placeholder="github_pat_… ou ghp_…" value="${esc(cloud.token)}"></div>
    <div class="field"><label>Modo</label>
      <select id="cl-mode" onchange="document.getElementById('cl-gistwrap').style.display=this.value==='existing'?'block':'none'">
        <option value="new">Criar Gist novo (primeiro dispositivo)</option>
        <option value="existing">Já tenho um Gist (colar ID)</option>
      </select></div>
    <div class="field" id="cl-gistwrap" style="display:none"><label>ID do Gist existente</label><input id="cl-gist" placeholder="ex.: 8f3b1c2d4e5f…"></div>
    <div id="cl-feedback"></div>`}
  `, connected?[
    `<button class="btn danger" onclick="cloudDisconnect()">Desligar sincronização</button>`,
    `<div class="spacer"></div>`,
    `<button class="btn" data-close>Fechar</button>`,
    `<button class="btn primary" onclick="cloudPull(false).then(()=>toast('Sincronizado.'))">Sincronizar agora</button>`
  ]:[
    `<div class="spacer"></div>`,
    `<button class="btn" data-close>Cancelar</button>`,
    `<button class="btn primary" onclick="cloudConnect()">Ligar</button>`
  ]);
}
async function cloudConnect(){
  const token=document.getElementById("cl-token").value.trim();
  const mode=document.getElementById("cl-mode").value;
  const fb=document.getElementById("cl-feedback");
  if(!token){ fb.innerHTML='<div class="cloud-status err">Indique o token.</div>'; return; }
  fb.innerHTML='<div class="cloud-status info">A ligar ao GitHub…</div>';
  try{
    let gistId;
    if(mode==="existing"){
      gistId=document.getElementById("cl-gist").value.trim();
      if(!gistId){ fb.innerHTML='<div class="cloud-status err">Indique o ID do Gist.</div>'; return; }
      // valida lendo
      const r=await fetch("https://api.github.com/gists/"+gistId,{headers:{"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json"}});
      if(!r.ok) throw new Error("HTTP "+r.status+" — token ou ID inválidos");
    } else {
      gistId=await cloudCreateGist(token);
    }
    cloud={token,gistId};
    safeSet(K_CFG,JSON.stringify(cloud));
    closeModal();
    await cloudPull(false);
    render();
    toast("Sincronização ligada.");
  }catch(e){ fb.innerHTML='<div class="cloud-status err">Falhou: '+esc(e.message)+'</div>'; }
}
function cloudDisconnect(){
  if(!confirm("Desligar a sincronização neste dispositivo? Os dados locais mantêm-se; deixa só de sincronizar com a nuvem.")) return;
  cloud={token:"",gistId:""};
  try{ localStorage.removeItem(K_CFG); }catch(e){}
  setSync("off","Sincronização desligada");
  closeModal(); render(); toast("Sincronização desligada.");
}

/* ================= MODAL PLUMBING ================= */
function showModal(title,body,footBtns){
  const wide=body.length>1400;
  const el=document.createElement("div"); el.className="overlay"; el.id="overlay";
  el.innerHTML=`<div class="modal ${wide?'wide':''}"><div class="modal-head"><h2>${title}</h2><button class="x" data-close>×</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot">${footBtns.filter(Boolean).join("")}</div></div>`;
  document.body.appendChild(el);
  el.addEventListener("click",e=>{ if(e.target===el||e.target.hasAttribute("data-close")) closeModal(); });
}
function closeModal(){ const el=document.getElementById("overlay"); if(el) el.remove(); }

      ["Acção","Prioridade","Estado","Atrasada","Crítica","Responsável","Prazo","Notas"],
      ...as.map(a=>[a.title,a.priority||"",stLabel(a.status),isLate(a)?"SIM":"",a.critico?"SIM":"",ownerName(a),a.deadline||"",a.notes||""])];

/* ================= EXPORT: PDF ================= */
function exportPdf(){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"a4"});
  const W=doc.internal.pageSize.getWidth(); const today=todayISO();
  const navy=[31,58,95], soft=[71,80,105], crit=[179,38,30], warn=[154,103,0];
  // Header band
  doc.setFillColor(...navy); doc.rect(0,0,W,76,"F");
  doc.setTextColor(255,255,255); doc.setFont("times","bold"); doc.setFontSize(19);
  doc.text("PR Corporation SA",40,38); doc.setFont("helvetica","normal"); doc.setFontSize(10);
  doc.setTextColor(180,205,230); doc.text("Projects Action Plan — Report executivo",40,56);
  doc.setTextColor(255,255,255); doc.text(today,W-40,38,{align:"right"});
  // KPIs
  const open=actions.filter(a=>a.status!=="concluido");
  const kpis=[["Críticos abertos",open.filter(a=>a.critico).length,crit],["Atrasadas",open.filter(isLate).length,warn],
    ["Em execução",actions.filter(a=>a.status==="em_execucao").length,navy],["Concluídas",actions.filter(a=>a.status==="concluido").length,[26,127,84]]];
  let x=40; const cw=(W-80-30)/4;
  kpis.forEach(([lab,val,col])=>{
    doc.setDrawColor(223,227,236); doc.setFillColor(251,252,253); doc.roundedRect(x,96,cw,58,5,5,"FD");
    doc.setFillColor(...col); doc.rect(x,96,3.5,58,"F");
    doc.setTextColor(...soft); doc.setFontSize(8); doc.text(lab.toUpperCase(),x+12,114);
    doc.setTextColor(...col); doc.setFont("times","bold"); doc.setFontSize(26); doc.text(String(val),x+12,144);
    doc.setFont("helvetica","normal"); x+=cw+10;
  });
  const stLabel=s=>STATUS[s]?STATUS[s].label:s;
  // Críticos
  let y=178;
  const critList=open.filter(a=>a.critico).sort((a,b)=>(a.priority||9)-(b.priority||9));
  doc.setTextColor(...navy); doc.setFont("times","bold"); doc.setFontSize(13); doc.text("Pendentes críticos",40,y); y+=6;
  doc.autoTable({startY:y,head:[["Pri","Acção","Projecto","Responsável","Estado","Prazo"]],
    body:critList.length?critList.map(a=>[a.priority||"–",a.title,projName(a.projectId),ownerName(a)||"—",stLabel(a.status)+(isLate(a)?" (atrasada)":""),a.deadline||"—"]):[["","Sem pendentes críticos.","","","",""]],
    theme:"grid",headStyles:{fillColor:navy,fontSize:8,halign:"left"},bodyStyles:{fontSize:8,textColor:[40,48,64]},
    columnStyles:{0:{cellWidth:28,halign:"center"},1:{cellWidth:170}},margin:{left:40,right:40}});
  // Atrasadas
  y=doc.lastAutoTable.finalY+22;
  const lateList=open.filter(isLate).sort((a,b)=>(a.deadline||"").localeCompare(b.deadline||""));
  doc.setTextColor(...navy); doc.setFont("times","bold"); doc.setFontSize(13); doc.text("Acções atrasadas",40,y); y+=6;
  doc.autoTable({startY:y,head:[["Acção","Projecto","Responsável","Prazo"]],
    body:lateList.length?lateList.map(a=>[a.title,projName(a.projectId),ownerName(a)||"—",a.deadline||"—"]):[["Sem acções atrasadas.","","",""]],
    theme:"grid",headStyles:{fillColor:warn,fontSize:8},bodyStyles:{fontSize:8,textColor:[40,48,64]},margin:{left:40,right:40}});
  // Estado por projecto
  y=doc.lastAutoTable.finalY+22;
  if(y>720){doc.addPage();y=50;}
  doc.setTextColor(...navy); doc.setFont("times","bold"); doc.setFontSize(13); doc.text("Estado por projecto",40,y); y+=6;
  doc.autoTable({startY:y,head:[["Pri","Projecto","Grupo","Lead","Progresso","Acções","Críticos"]],
    body:projects.slice().sort((a,b)=>(a.priority||99)-(b.priority||99)).map(p=>{const as=projActions(p.id);return[p.priority||"–",p.name,p.grupo,projLeadName(p)||"—",projProgress(p.id)+"%",as.length,as.filter(a=>a.critico&&a.status!=="concluido").length];}),
    theme:"grid",headStyles:{fillColor:navy,fontSize:8},bodyStyles:{fontSize:8,textColor:[40,48,64]},columnStyles:{0:{cellWidth:28,halign:"center"}},margin:{left:40,right:40}});
  // Footer
  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFontSize(7);doc.setTextColor(150,158,172);
    doc.text("PR Corporation SA · Confidencial · Gerado em "+today,40,doc.internal.pageSize.getHeight()-20);
    doc.text(`${i}/${pages}`,W-40,doc.internal.pageSize.getHeight()-20,{align:"right"});}
  doc.save(`PRCorporation_Board_${today}.pdf`);
  toast("PDF descarregado.");
}

/* ================= EVENT BINDINGS ================= */
function bindGlobal(){
  document.querySelectorAll("[data-nav]").forEach(el=>el.onclick=e=>{e.preventDefault();view=el.getAttribute("data-nav");openProjectId=null;openPersonId=null;render();});
  document.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>{
    const a=el.getAttribute("data-act");
    if(a==="new-project")projectModal();
    else if(a==="new-action"){if(!projects.length){toast("Crie primeiro um projecto.");return;}actionModal(null,el.getAttribute("data-for"));}
    else if(a==="new-person")personModal();
    else if(a==="cloud-settings")cloudModal();
    else if(a==="logout"){ sessionStorage.removeItem("tc:auth"); showLogin(); }
    else if(a==="export-xlsx")exportXlsx();
    else if(a==="export-pdf")exportPdf();
  });
  document.querySelectorAll("[data-edit-project]").forEach(el=>el.onclick=e=>{e.stopPropagation();projectModal(projects.find(p=>p.id===el.getAttribute("data-edit-project")));});
  document.querySelectorAll("[data-edit-action]").forEach(el=>el.onclick=e=>{e.stopPropagation();actionModal(actions.find(a=>a.id===el.getAttribute("data-edit-action")));});
  document.querySelectorAll("[data-edit-person]").forEach(el=>el.onclick=e=>{e.stopPropagation();personModal(person(el.getAttribute("data-edit-person")));});
  bindRowClicks();
}
function bindRowClicks(){
  document.querySelectorAll("[data-open-project]").forEach(el=>el.onclick=()=>{openProjectId=el.getAttribute("data-open-project");view="projects";render();});
  document.querySelectorAll("[data-open-action]").forEach(el=>el.onclick=()=>{actionModal(actions.find(a=>a.id===el.getAttribute("data-open-action")));});
  document.querySelectorAll("[data-open-person]").forEach(el=>el.onclick=()=>{openPersonId=el.getAttribute("data-open-person");view="people";render();});
}

/* ================= BOOT ================= */
async function boot(){ await loadAll(); render(); }
// Pede a palavra-passe sempre que a app abre (sessão nova). Um reload na mesma sessão não volta a pedir.
(function(){
  if(sessionStorage.getItem("tc:auth")==="1") boot();
  else showLogin();
})();
// Sincronização periódica: a cada 60s verifica se há versão mais recente na nuvem
setInterval(()=>{ if(cloud.token&&cloud.gistId&&syncState!=="syncing"&&!document.getElementById("overlay")&&sessionStorage.getItem("tc:auth")==="1") cloudPull(false); }, 60000);
// Ao voltar à app (mudar de separador/dispositivo), sincroniza
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&cloud.token&&cloud.gistId&&!document.getElementById("overlay")&&sessionStorage.getItem("tc:auth")==="1") cloudPull(false); });
