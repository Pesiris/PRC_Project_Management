<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PR Corporation SA — Painel de Gestão de Projectos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#1a2332; --ink-soft:#475069; --line:#dfe3ec; --line-soft:#eef0f5;
  --bg:#f6f7f9; --panel:#ffffff; --brand:#1f3a5f; --brand-2:#2d5a8c;
  --crit:#b3261e; --crit-bg:#fdeceb; --warn:#9a6700; --warn-bg:#fdf5e3;
  --ok:#1a7f54; --ok-bg:#e7f4ee; --block:#7a3ea8; --block-bg:#f3ebfa;
  --idle:#5a6478; --idle-bg:#eef0f5;
  --accent:#c8862e;
  --r:10px; --r-sm:7px; --sh:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
  --mono:'SF Mono',ui-monospace,'Cascadia Mono','Roboto Mono',monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap');

/* ---- Topbar ---- */
.topbar{background:var(--brand);color:#fff;padding:0 22px;height:60px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:'Fraunces',serif;font-weight:600;font-size:19px;letter-spacing:.2px}
.brand span{font-size:11px;color:#a9c0dc;text-transform:uppercase;letter-spacing:1.5px}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{background:none;border:0;color:#bcd0e6;padding:8px 15px;border-radius:var(--r-sm);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.tab:hover{background:rgba(255,255,255,.08);color:#fff}
.tab.on{background:#fff;color:var(--brand);font-weight:600}
.subbar{background:#fff;border-bottom:1px solid var(--line);padding:0 22px;display:flex;gap:2px;height:44px;align-items:center;position:sticky;top:60px;z-index:39;overflow-x:auto}
.subtab{background:none;border:0;color:var(--ink-soft);padding:7px 14px;border-radius:var(--r-sm);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.15s}
.subtab:hover{background:var(--line-soft);color:var(--ink)}
.subtab.on{background:var(--brand);color:#fff;font-weight:600}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.scope-tag{font-size:11px;color:#a9c0dc;border:1px solid rgba(255,255,255,.2);padding:3px 9px;border-radius:20px}
.sync-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#cfe0f0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);padding:5px 11px;border-radius:20px;cursor:pointer;font-family:inherit;transition:.15s}
.sync-badge:hover{background:rgba(255,255,255,.16)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#8aa0b6}
.sync-off .sync-dot{background:#8aa0b6}
.sync-idle .sync-dot{background:#8aa0b6}
.sync-ok .sync-dot,.sync-saved .sync-dot{background:#3ecf8e;box-shadow:0 0 0 3px rgba(62,207,142,.25)}
.sync-syncing .sync-dot,.sync-saving .sync-dot{background:#f5c451;animation:pulse 1s infinite}
.sync-error .sync-dot{background:#ff6b6b;box-shadow:0 0 0 3px rgba(255,107,107,.25)}
.role-chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.3px}
.role-chip.admin{background:rgba(62,207,142,.18);color:#cfe9dd;border:1px solid rgba(62,207,142,.3)}
.role-chip.ler{background:rgba(255,255,255,.08);color:#cfe0f0;border:1px solid rgba(255,255,255,.16)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.cloud-steps{counter-reset:step;margin:0 0 4px}
.cloud-steps li{list-style:none;position:relative;padding:0 0 14px 34px;font-size:13px;color:var(--ink-soft);line-height:1.55}
.cloud-steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;width:23px;height:23px;background:var(--brand);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.cloud-steps li b{color:var(--ink)}
.cloud-steps a{color:var(--brand-2)}
.cloud-status{padding:10px 12px;border-radius:8px;font-size:12px;margin-top:6px}
.cloud-status.ok{background:var(--ok-bg);color:var(--ok)}
.cloud-status.err{background:var(--crit-bg);color:var(--crit)}
.cloud-status.info{background:#eef3f8;color:var(--brand-2)}

/* ---- Buttons ---- */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:var(--r-sm);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c2c9d6;background:#fafbfc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{border-color:transparent;background:rgba(255,255,255,.1);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.18)}
.btn.danger{color:var(--crit);border-color:#f0c9c6}
.btn.danger:hover{background:var(--crit-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11px}

/* ---- Layout ---- */
.wrap{max-width:1320px;margin:0 auto;padding:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.page-head h1{font-family:'Fraunces',serif;font-weight:600;font-size:25px;letter-spacing:-.2px}
.page-head p{color:var(--ink-soft);font-size:13px;margin-top:2px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}

/* ---- KPI cards ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);font-weight:600}
.kpi .num{font-size:34px;font-weight:700;font-family:'Fraunces',serif;line-height:1.1;margin-top:6px}
.kpi .sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi.c-crit .bar{background:var(--crit)} .kpi.c-crit .num{color:var(--crit)}
.kpi.c-exec .bar{background:var(--brand-2)} .kpi.c-exec .num{color:var(--brand-2)}
.kpi.c-ok .bar{background:var(--ok)} .kpi.c-ok .num{color:var(--ok)}
.kpi.c-warn .bar{background:var(--warn)} .kpi.c-warn .num{color:var(--warn)}

/* ---- Section headers ---- */
.sec{margin-bottom:22px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.sec-head h2{font-size:15px;font-weight:600}
.sec-head .count{background:var(--line-soft);color:var(--ink-soft);font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}

/* ---- Badges ---- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.b-crit{background:var(--crit-bg);color:var(--crit)}
.b-exec{background:#e8eff6;color:var(--brand-2)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-block{background:var(--block-bg);color:var(--block)}
.b-idle{background:var(--idle-bg);color:var(--idle)}
.b-late{background:var(--warn-bg);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ---- Tables ---- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfcfd}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:.1s}
tbody tr:hover{background:#fafbfc}
.t-title{font-weight:600;color:var(--ink)}
.t-meta{font-size:12px;color:var(--ink-soft)}
.prio-chip{font-family:var(--mono);font-size:11px;font-weight:700;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;background:var(--line-soft);color:var(--ink)}
.prio-chip.p1{background:#fde7e6;color:var(--crit)}
.prio-chip.p2{background:var(--warn-bg);color:var(--warn)}

/* ---- Project grid ---- */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.proj-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:.15s}
.proj-card.reordering{cursor:grab;border-color:var(--brand-2);border-style:dashed}
.proj-card.reordering:active{cursor:grabbing}
.proj-card.dragging{opacity:.5;transform:scale(.97)}
.drag-handle{background:var(--brand);color:#fff;font-size:11px;font-weight:600;padding:5px 12px;text-align:center;letter-spacing:.3px}
.proj-card:hover{border-color:#c2c9d6;transform:translateY(-1px);box-shadow:0 4px 18px rgba(20,30,50,.1)}
.proj-card .pc-top{padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.proj-card h3{font-size:16px;font-weight:600}
.proj-card .pc-grp{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.proj-card .pc-body{padding:14px 16px}
.proj-card .pc-scope{font-size:12px;color:var(--ink-soft);margin-bottom:12px;min-height:32px}
.progress{height:6px;background:var(--line-soft);border-radius:20px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:20px;transition:.4s}
.pc-stats{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--ink-soft)}
.pc-foot{padding:10px 16px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between}

/* ---- Modal ---- */
.overlay{position:fixed;inset:0;background:rgba(20,30,50,.45);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease}
.modal.wide{max-width:920px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
.modal-head .x{border:0;background:none;font-size:22px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px}
.modal-head .x:hover{background:var(--line-soft)}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto}
.prof-table{width:100%;border-collapse:collapse;font-size:13px}
.prof-table th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);text-align:left;padding:8px 8px;white-space:nowrap}
.prof-table td{padding:8px 8px;border-top:1px solid var(--line-soft);vertical-align:middle}
.prof-table select{max-width:120px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fbfcfd;border-radius:0 0 14px 14px}

/* ---- Forms ---- */
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(45,90,140,.12)}
.field textarea{resize:vertical;min-height:64px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frow-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{width:auto}

/* ---- Detail / log ---- */
.detail-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.dm{background:#fbfcfd;border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:10px 12px}
.dm .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);font-weight:600}
.dm .v{font-size:14px;font-weight:600;margin-top:3px}
.log{border-left:2px solid var(--line);padding-left:16px;margin-top:6px}
.log-item{position:relative;padding-bottom:14px}
.log-item::before{content:'';position:absolute;left:-21px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--brand-2);border:2px solid #fff}
.log-item .when{font-size:11px;color:var(--ink-soft);font-family:var(--mono)}
.log-item .what{font-size:13px;margin-top:1px}
.log-empty{color:var(--ink-soft);font-size:13px;font-style:italic}

/* ---- Filters ---- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input[type=search]{padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;font-size:13px;min-width:220px}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;font-size:13px;background:#fff}
.spacer{flex:1}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.empty-state h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.loading{text-align:center;padding:80px;color:var(--ink-soft)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s}
.inline-edit-row td{background:#fbfcfd}

/* ---- People ---- */
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.person-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;cursor:pointer;transition:.15s;display:flex;gap:13px;align-items:flex-start}
.person-card:hover{border-color:#c2c9d6;transform:translateY(-1px);box-shadow:0 4px 18px rgba(20,30,50,.1)}
.person-card.inactive{opacity:.6}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;background:var(--brand-2);font-family:var(--mono)}
.avatar.lg{width:64px;height:64px;font-size:20px}
.person-card .pi-name{font-weight:600;font-size:14px}
.person-card .pi-role{font-size:12px;color:var(--ink-soft);margin-top:1px}
.person-card .pi-meta{font-size:11px;color:var(--ink-soft);margin-top:7px;display:flex;flex-wrap:wrap;gap:8px}
.person-head{display:flex;gap:18px;align-items:center;margin-bottom:20px}
.team-chips{display:flex;flex-wrap:wrap;gap:8px}
.team-chip{display:inline-flex;align-items:center;gap:7px;background:#fbfcfd;border:1px solid var(--line);border-radius:24px;padding:4px 12px 4px 4px;font-size:12px;font-weight:500;cursor:pointer;transition:.12s}
.team-chip:hover{border-color:#c2c9d6;background:#fff}
.team-chip .avatar{width:26px;height:26px;font-size:10px}
.team-chip.note{cursor:default;color:var(--ink-soft);padding:5px 12px;font-style:italic}
.team-chip.note:hover{border-color:var(--line);background:#fbfcfd}

@media(max-width:720px){
  .tabs{display:none}
  .frow,.frow-3{grid-template-columns:1fr}
  .wrap{padding:14px}
}
/* ---- Cronograma (Gantt) ---- */
.gantt{font-size:12px;position:relative}
.g-head{display:flex;border-bottom:1px solid var(--line);background:#fbfcfd;position:relative;height:30px}
.g-lab-head{width:220px;flex:none;border-right:1px solid var(--line)}
.g-track-head{flex:1;position:relative}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft)}
.g-tick span{position:absolute;top:8px;left:4px;font-size:10px;color:var(--ink-soft);white-space:nowrap}
.g-body{position:relative;max-height:340px;overflow-y:auto}
.g-row{display:flex;align-items:center;height:30px;border-bottom:1px solid var(--line-soft)}
.g-row:hover{background:#fafbfc}
.g-lab{width:220px;flex:none;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);font-size:12px;display:flex;align-items:center;gap:5px}
.g-caret{cursor:pointer;color:var(--brand-2);font-size:10px;width:12px;flex:none;user-select:none}
.g-caret-spacer{width:12px;flex:none}
.g-projname{cursor:pointer;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.g-projname:hover{color:var(--brand-2)}
.g-goto{margin-left:auto;cursor:pointer;color:var(--brand-2);font-weight:700;padding:0 4px;flex:none;text-decoration:none}
.g-goto:hover{background:var(--line-soft);border-radius:4px}
.gantt-full .g-body{max-height:none}
.gantt-full .g-bar{height:18px}
.gantt-full .g-row{height:38px}
.g-lab.proj{font-weight:700;color:var(--ink)}
.g-lab.act{padding-left:24px;color:var(--ink-soft)}
.g-dot.proj{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--brand);margin-right:7px;vertical-align:middle}
.g-track{flex:1;position:relative;height:100%}
.g-bar{position:absolute;top:50%;transform:translateY(-50%);height:14px;border-radius:4px;cursor:pointer;min-width:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.g-bar:hover{filter:brightness(.93);height:16px}
.g-bar.proj{background:#cfd8e4;height:9px;border-radius:3px}
.g-bar.exec{background:#5a8bc0}
.g-bar.crit{background:#d8675f}
.g-bar.late{background:#e0a93b}
.g-bar.block{background:#9b6cc4}
.g-bar.done{background:#5cb38a}
.g-bar.milestone{width:14px!important;height:14px!important;border-radius:50%;transform:translateY(-50%) rotate(0)}
.g-nodate{font-size:10px;color:#b0b6c0;font-style:italic;padding-left:8px;line-height:30px}
.g-today-line{position:absolute;top:0;bottom:0;width:2px;background:#b3261e;z-index:2}
.g-today-line.full{position:absolute;top:0;bottom:0;width:2px;background:rgba(179,38,30,.5);z-index:1;pointer-events:none}
.lg-chip{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:middle}
.lg-chip.exec{background:#5a8bc0}.lg-chip.crit{background:#d8675f}.lg-chip.late{background:#e0a93b}.lg-chip.done{background:#5cb38a}
.lg-chip.today{background:#b3261e;width:3px;height:11px;border-radius:1px}

/* ---- Ecrã de bloqueio ---- */
.lock{position:fixed;inset:0;background:linear-gradient(135deg,#1f3a5f,#15273f);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.lock-card{background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.4);width:100%;max-width:380px;padding:36px 34px;text-align:center;animation:pop .25s ease}
.lock-card .lk-brand{font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:#1f3a5f}
.lock-card .lk-sub{font-size:11px;color:#98a2b3;text-transform:uppercase;letter-spacing:2px;margin-bottom:24px}
.lock-card .lk-lock{width:48px;height:48px;margin:0 auto 16px;border-radius:50%;background:#e8eff6;display:flex;align-items:center;justify-content:center;font-size:22px}
.lock-card label{display:block;text-align:left;font-size:12px;font-weight:600;color:#475069;margin:0 0 5px}
.lock-card input{width:100%;padding:11px 13px;border:1px solid #dfe3ec;border-radius:8px;font-size:14px;margin-bottom:14px;font-family:inherit}
.lock-card input:focus{outline:0;border-color:#2d5a8c;box-shadow:0 0 0 3px rgba(45,90,140,.12)}

function showLogin(errMsg){
  const app=document.getElementById("app");

    <label>Palavra-passe</label>
    <input id="lk-pass" type="password" autocomplete="current-password">
    <button id="lk-btn">Entrar</button>
  </div></div>`;
  const tryLogin=async()=>{
    const email=document.getElementById("lk-user").value.trim();
    const pass=document.getElementById("lk-pass").value;
    const btn=document.getElementById("lk-btn");
    if(!email||!pass){ showErr("Indique email e palavra-passe."); return; }

  document.getElementById("lk-pass").addEventListener("keydown",e=>{ if(e.key==="Enter") tryLogin(); });
  document.getElementById("lk-user").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("lk-pass").focus(); });
}
function traduzErro(m){
  if(/invalid login/i.test(m)) return "Email ou palavra-passe incorrectos.";
  if(/email not confirmed/i.test(m)) return "Conta por confirmar. Contacte o administrador.";
  return m;
}

// Resolve uma pessoa a partir de um token de texto (iniciais ou nome)
function personByToken(tok){
  tok=(tok||"").trim(); if(!tok||tok==="—") return null;
  let m=people.find(u=>u.initials && u.initials.toLowerCase()===tok.toLowerCase());
  if(m) return m;
  m=people.find(u=>u.name.toLowerCase()===tok.toLowerCase());
  if(m) return m;
  return people.find(u=>u.name.toLowerCase().startsWith(tok.toLowerCase())) || null;
}
// Converte dados antigos (owner/support em texto) para ownerId/supportIds
function migrateActions(){
  actions.forEach(a=>{
    if(a.ownerId===undefined){ const m=people.find(u=>u.name===a.owner); a.ownerId=m?m.id:""; delete a.owner; }
    if(a.supportIds===undefined){ const m=people.find(u=>u.name===a.support); a.supportIds=m?[m.id]:[]; delete a.support; }
  });
}
// Converte lead/support de texto para leadId + memberIds, preservando só o texto não reconhecido
function migrateProjects(){
  projects.forEach(p=>{
    if(p.leadId===undefined){
      const ids=[]; const unmatched=[];
      const consume=str=>String(str||"").split(/[+\/,]/).map(t=>t.replace(/[()?]/g,"").trim()).filter(t=>t&&t!=="—")
        .forEach(t=>{ const u=personByToken(t); if(u){ if(!ids.includes(u.id)) ids.push(u.id);} else if(!unmatched.includes(t)) unmatched.push(t); });
      consume(p.lead); consume(p.support);
      p.leadId = ids[0]||""; p.memberIds = ids.slice(1); p.teamNote = unmatched.join(", ");
      delete p.lead; delete p.support;
    }
  });
}

let saveTimer=null, _pendingLog=[];

// Limpa um objecto para conter só as colunas da tabela (evita enviar campos a mais)
function pick(obj, keys){ const o={}; keys.forEach(k=>{ if(obj[k]!==undefined) o[k]=obj[k]; }); return o; }
const PROJ_COLS=["id","name","grupo","priority","scope","notes","leadId","memberIds","teamNote","companyId"];
const ACT_COLS=["id","projectId","title","ownerId","supportIds","status","critico","priority","deadline","beginDate","notes"];
const PPL_COLS=["id","name","initials","role","company","area","email","phone","status","notes","photo"];

async function saveNow(){
  if(!canEdit("projectos")) return;
  try{
    // 1. Upsert dos registos actuais
    const projRows=projects.map(p=>pick(p,PROJ_COLS));
    const actRows=actions.map(a=>pick(a,ACT_COLS));
    const pplRows=people.map(u=>pick(u,PPL_COLS));
    if(projRows.length){ const {error}=await sb.from("projects").upsert(projRows); if(error) throw error; }
    if(actRows.length){ const {error}=await sb.from("actions").upsert(actRows); if(error) throw error; }
    if(pplRows.length){ const {error}=await sb.from("people").upsert(pplRows); if(error) throw error; }
    // 2. Apagar os que foram removidos em memória
    const delFrom=async(table,curIds,lastSet)=>{
      const toDel=[...lastSet].filter(id=>!curIds.has(id));
      if(toDel.length){ const {error}=await sb.from(table).delete().in("id",toDel); if(error) throw error; }
    };
    await delFrom("projects", new Set(projects.map(p=>p.id)), _lastIds.projects);
    await delFrom("actions",  new Set(actions.map(a=>a.id)),  _lastIds.actions);
    await delFrom("people",   new Set(people.map(u=>u.id)),   _lastIds.people);
    // 3. Gravar novas entradas de histórico (append)
    if(_pendingLog.length){
      const rows=_pendingLog.map(l=>({ts:l.ts,entity:l.entity,what:l.what,refId:l.refId}));
      const {error}=await sb.from("log_entries").insert(rows);
      if(!error) _pendingLog=[];
    }
    snapshotIds();
    setSave("saved","Guardado · "+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ setSave("error","Erro ao guardar: "+(e.message||e)); }
}
async function pushLog(entity,what,refId){
  const entry={ts:new Date().toISOString(),entity,what,refId};
  logEntries.push(entry);
  _pendingLog.push(entry);
}

function todayISO(){ return new Date().toISOString().slice(0,10); }
function isLate(a){ return a.deadline && a.status!=="concluido" && a.deadline < todayISO(); }
function projActions(pid){ return actions.filter(a=>a.projectId===pid); }
function projProgress(pid){ const as=projActions(pid); if(!as.length) return 0; return Math.round(as.filter(a=>a.status==="concluido").length/as.length*100); }
function projName(pid){ const p=projects.find(x=>x.id===pid); return p?p.name:"—"; }
function uid(pre){ return pre+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3); }
function person(id){ return people.find(u=>u.id===id)||null; }
function personName(id){ const u=person(id); return u?u.name:""; }
function personActions(uid){ return actions.filter(a=>a.ownerId===uid || (a.supportIds||[]).includes(uid)); }
function activePeople(){ return people.filter(u=>u.status==="ativo").sort((a,b)=>a.name.localeCompare(b.name)); }
function projLeadName(p){ return personName(p.leadId)||""; }
function projMemberNames(p){ return (p.memberIds||[]).map(personName).filter(Boolean); }
function projTeamText(p){ const names=projMemberNames(p); const extra=p.teamNote?[p.teamNote]:[]; return names.concat(extra).join(", "); }

// Normaliza um nome para cruzamento (sem acentos, minúsculas, espaços simples)
function normName(s){ return (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim(); }
// Encontra a Pessoa (dos projectos) que corresponde a um nome de trabalhador de RH
function personByName(name){
  const n=normName(name); if(!n) return null;
  let m=people.find(u=>normName(u.name)===n); if(m) return m;
  // correspondência aproximada: um nome contém o outro (mínimo 4 caracteres)
  if(n.length>=4){ m=people.find(u=>{const un=normName(u.name); return un.includes(n)||n.includes(un);}); if(m) return m; }
  return null;
}
// Projectos e acções onde uma Pessoa está envolvida
function personProjects(uid){ return projects.filter(p=>p.leadId===uid || (p.memberIds||[]).includes(uid)); }

/* ================= CRONOGRAMA (GANTT) =================
   opts.mode: 'dashboard' (só projectos, expansível) | 'project' (acções de 1 projecto) | 'full' (ecrã inteiro)
   opts.projectId: para modo 'project'
   opts.expanded: Set de ids de projecto expandidos (modo dashboard)
*/
let ganttExpanded = new Set();  // projectos expandidos no cronograma do dashboard
function ganttPanel(opts){
  opts=opts||{mode:'dashboard'};
  const mode=opts.mode||'dashboard';
  const parse=d=>{ if(!d) return null; const t=new Date(d+"T00:00:00"); return isNaN(t)?null:t; };
  const today=new Date(todayISO()+"T00:00:00");
  const rows=[];
  let minD=null, maxD=null;
  const consider=(s,e)=>{ if(s){minD=!minD||s<minD?s:minD; maxD=!maxD||s>maxD?s:maxD;} if(e){minD=!minD||e<minD?e:minD; maxD=!maxD||e>maxD?e:maxD;} };

  // Que projectos mostrar
  let projList;
  if(mode==='project'){ const p=projects.find(x=>x.id===opts.projectId); projList=p?[p]:[]; }
  else projList=projects.slice().sort((a,b)=>(a.priority||99)-(b.priority||99));

  projList.forEach(p=>{
    const as=projActions(p.id);
    const dated=as.filter(a=>a.beginDate||a.deadline);
    let ps=null,pe=null;
    dated.forEach(a=>{ const s=parse(a.beginDate)||parse(a.deadline), e=parse(a.deadline)||parse(a.beginDate); if(s&&(!ps||s<ps))ps=s; if(e&&(!pe||e>pe))pe=e; });

    if(mode==='project'){
      // Só as acções (sem a barra-envelope do projecto)
      dated.forEach(a=>{ const s=parse(a.beginDate)||parse(a.deadline), e=parse(a.deadline)||parse(a.beginDate);
        rows.push({type:'act',label:a.title,start:s,end:e,status:a.status,late:isLate(a),critico:a.critico,actId:a.id}); consider(s,e); });
    } else {
      // Dashboard/full: barra do projecto; acções só se expandido
      const expanded = ganttExpanded.has(p.id);
      if(ps||pe){ rows.push({type:'proj',label:p.name,start:ps,end:pe,projId:p.id,expandable:dated.length>0,expanded}); consider(ps,pe); }
      else rows.push({type:'proj',label:p.name,start:null,end:null,projId:p.id,nodate:true});
      if(expanded){
        dated.forEach(a=>{ const s=parse(a.beginDate)||parse(a.deadline), e=parse(a.deadline)||parse(a.beginDate);
          rows.push({type:'act',label:a.title,start:s,end:e,status:a.status,late:isLate(a),critico:a.critico,actId:a.id}); consider(s,e); });
      }
    }
  });

  const emptyMsg = mode==='project'
    ? `<div class="empty-state"><p>Sem datas nas acções deste projecto. Adicione início/prazo às acções para ver o cronograma.</p></div>`
    : `<div class="empty-state"><p>Sem datas definidas nas acções ainda. Adicione datas de início e prazo às acções.</p></div>`;
  if(!minD||!maxD){
    if(mode==='project') return `<div class="panel">${emptyMsg}</div>`;
    return `<div class="sec"><div class="sec-head"><h2>Cronograma</h2></div><div class="panel">${emptyMsg}</div></div>`;
  }

  if(today<minD)minD=today; if(today>maxD)maxD=today;
  const pad=Math.max(3, Math.round((maxD-minD)/(1000*60*60*24)*0.05));
  minD=new Date(minD.getTime()-pad*864e5); maxD=new Date(maxD.getTime()+pad*864e5);
  const span=(maxD-minD)||864e5;
  const pct=d=>((d-minD)/span*100);

  const ticks=[]; let t=new Date(minD.getFullYear(),minD.getMonth(),1);
  while(t<=maxD){ if(t>=minD) ticks.push(new Date(t)); t=new Date(t.getFullYear(),t.getMonth()+1,1); }
  const meses=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const tickHtml=ticks.map(d=>`<div class="g-tick" style="left:${pct(d)}%"><span>${meses[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</span></div>`).join("");
  const todayPct=pct(today);
  const labW = mode==='full'?260:220;

  const barHtml=rows.map(r=>{
    if(r.nodate) return `<div class="g-row"><div class="g-lab proj"><span class="g-dot proj"></span>${esc(r.label)}</div><div class="g-track"><span class="g-nodate">sem datas</span></div></div>`;
    const s=r.start||r.end, e=r.end||r.start;
    let left=pct(s), width=Math.max(0.8, pct(e)-pct(s));
    let cls = r.type==='proj' ? 'proj' : (r.status==='concluido'?'done':r.late?'late':r.critico?'crit':r.status==='bloqueado'?'block':'exec');
    const oneDay = (e-s)<864e5*1.5;
    const tip = `${r.label} · ${r.start?fmtD(r.start):'?'}${r.end&&r.end!==r.start?' → '+fmtD(r.end):''}`;
    // Label: projecto expansível tem seta + botão de saltar para a ficha
    let labelInner;
    if(r.type==='proj'){
      const caret = r.expandable?`<span class="g-caret" data-gantt-toggle="${r.projId}">${r.expanded?'▼':'▶'}</span>`:'<span class="g-caret-spacer"></span>';
      labelInner=`${caret}<span class="g-projname" data-gantt-toggle="${r.projId}">${esc(r.label)}</span><span class="g-goto" data-goto-projbtn="${r.projId}" title="Abrir ficha do projecto">↗</span>`;
    } else {
      labelInner=`<span data-open-action="${r.actId}" style="cursor:pointer">${esc(r.label)}</span>`;
    }
    const barData = r.type==='proj'?`data-gantt-toggle="${r.projId}"`:`data-open-action="${r.actId}"`;
    return `<div class="g-row">
      <div class="g-lab ${r.type}" style="width:${labW}px">${labelInner}</div>
      <div class="g-track">
        <div class="g-bar ${cls} ${oneDay?'milestone':''}" ${barData} style="left:${left}%;width:${width}%" title="${esc(tip)}"></div>
      </div></div>`;
  }).join("");

  const legend = `<span style="font-size:11px;color:var(--ink-soft);display:flex;gap:12px;flex-wrap:wrap">
        <span><span class="lg-chip exec"></span>Em execução</span><span><span class="lg-chip crit"></span>Crítica</span>
        <span><span class="lg-chip late"></span>Atrasada</span><span><span class="lg-chip done"></span>Concluída</span>
        <span><span class="lg-chip today"></span>Hoje</span></span>`;
  const ganttInner = `<div class="gantt ${mode==='full'?'gantt-full':''}">
        <div class="g-head"><div class="g-lab-head" style="width:${labW}px"></div><div class="g-track-head">${tickHtml}<div class="g-today-line" style="left:${todayPct}%"></div></div></div>
        <div class="g-body">
          <div class="g-today-line full" style="left:calc(${labW}px + (100% - ${labW}px) * ${todayPct/100})"></div>
          ${barHtml}
        </div>
      </div>`;

  if(mode==='project'){
    return `<div class="panel" style="padding:0;overflow:hidden">${ganttInner}</div>`;
  }
  if(mode==='full'){
    return ganttInner;
  }
  // dashboard
  return `<div class="sec"><div class="sec-head"><h2>Cronograma</h2><span class="count">${projList.length} projectos</span>
      <span style="margin-left:auto;display:flex;gap:12px;align-items:center">${legend}
      <button class="btn ghost sm" data-act="gantt-full" title="Abrir em página própria">⛶ Ampliar</button></span></div>
    <div style="font-size:11px;color:var(--ink-soft);margin:-6px 0 8px">Clique num projecto para ver as suas acções. Use ↗ para abrir a ficha.</div>
    <div class="panel" style="padding:0;overflow:hidden">${ganttInner}</div></div>`;
}
function fmtD(d){ return d.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
// Página própria do cronograma (ecrã inteiro)
function renderGanttFull(){
  return `<div class="page-head"><div>
      <p style="margin-bottom:4px"><a href="#" data-nav="dashboard" style="color:var(--brand-2);text-decoration:none;font-size:13px">← Dashboard</a></p>
      <h1>Cronograma — vista ampliada</h1><p>Clique num projecto para expandir as acções</p></div></div>
    <div class="panel" style="padding:0;overflow:auto">${ganttPanel({mode:'full'})}</div>`;

// Lê a foto escolhida, redimensiona para ~256px e comprime para JPEG (data URL leve)
function handlePhotoPick(input){
  const file=input.files&&input.files[0]; if(!file) return;
  if(!file.type.startsWith("image/")){ toast("Escolha um ficheiro de imagem."); return; }
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=256;
      const canvas=document.createElement("canvas"); canvas.width=max; canvas.height=max;
      const ctx=canvas.getContext("2d");
      // recorte quadrado central da imagem original, redimensionado para 256x256
      const sw=img.width, sh=img.height, sSide=Math.min(sw,sh);
      ctx.drawImage(img,(sw-sSide)/2,(sh-sSide)/2,sSide,sSide,0,0,max,max);
      const dataUrl=canvas.toDataURL("image/jpeg",0.82);
      window._tmpPhoto=dataUrl;
      const prev=document.getElementById("mp-photo-prev");
      if(prev){ prev.style.backgroundImage=`url('${dataUrl}')`; prev.style.backgroundSize="cover"; prev.style.backgroundPosition="center"; prev.textContent=""; }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearPhotoPick(){
  window._tmpPhoto="";
  const prev=document.getElementById("mp-photo-prev");
  if(prev){ prev.style.backgroundImage=""; prev.style.background="#2d5a8c"; const n=document.getElementById("mp-name"); prev.textContent=((n&&n.value)||"?").slice(0,2).toUpperCase(); }
}
async function savePerson(id){
  const v=k=>document.getElementById(k).value.trim();
  const name=v("mp-name"); if(!name){toast("Indique o nome.");return;}
  const data={name,initials:v("mp-initials"),role:v("mp-role"),company:v("mp-company"),area:v("mp-area"),email:v("mp-email"),phone:v("mp-phone"),status:document.getElementById("mp-status").value,notes:v("mp-notes"),photo:window._tmpPhoto||""};
  if(id){ const u=person(id); const changes=diffPerson(u,data); Object.assign(u,data);
    pushLog("Pessoa · "+name, changes.length?("Editada: "+changes.join("; ")):"Guardada sem alterações.", id); toast("Ficha actualizada."); }
  else { const nu={id:uid("u_"),...data}; people.push(nu);
    pushLog("Pessoa · "+name,"Ficha criada.",nu.id); openPersonId=nu.id; view="people"; toast("Ficha criada."); }
  window._tmpPhoto=""; closeModal(); render(); persist();
}
async function deletePerson(id){
  const u=person(id);
  const refs=personActions(id).length;
  const projRefs=projects.filter(p=>p.leadId===id||(p.memberIds||[]).includes(id)).length;
  const total=refs+projRefs;
  if(total && !confirm(`${u.name} está ligado a ${refs} acção(ões) e ${projRefs} projecto(s). Ao apagar, será removido de todos. Continuar?`)) return;
  if(!total && !confirm(`Apagar a ficha de ${u.name}?`)) return;
  actions.forEach(a=>{ if(a.ownerId===id) a.ownerId=""; a.supportIds=(a.supportIds||[]).filter(x=>x!==id); });
  projects.forEach(p=>{ if(p.leadId===id) p.leadId=""; p.memberIds=(p.memberIds||[]).filter(x=>x!==id); });
  people=people.filter(x=>x.id!==id);
  pushLog("Pessoa · "+u.name,`Ficha apagada (estava em ${refs} acção(ões) e ${projRefs} projecto(s)).`,id);
  closeModal(); openPersonId=null; view="people"; render(); toast("Ficha apagada."); persist();
}
function diffPerson(o,n){
  const labels={name:"nome",initials:"iniciais",role:"função",company:"empresa",area:"área",email:"email",phone:"telefone",status:"estado",notes:"notas"};
  const out=[]; for(const k in labels){ let ov=o[k],nv=n[k];
    if(k==="status"){ ov=ESTADOS_PESSOA[ov]||ov; nv=ESTADOS_PESSOA[nv]||nv; }
    if((ov||"")!==(nv||"")) out.push(`${labels[k]}: «${ov||"—"}» → «${nv||"—"}»`); }
  if((o.photo||"")!==(n.photo||"")) out.push(n.photo?"foto actualizada":"foto removida");
  return out;
}

async function saveProject(id){
  const v=k=>document.getElementById(k).value.trim();
  const name=v("m-name"); if(!name){toast("Indique o nome do projecto.");return;}
  const memSel=document.getElementById("m-members");
  const memberIds=memSel?Array.from(memSel.selectedOptions).map(o=>o.value):[];
  const companyId=document.getElementById("m-company")?document.getElementById("m-company").value:"";
  const data={name,grupo:document.getElementById("m-grupo").value,priority:+v("m-prio")||null,leadId:document.getElementById("m-lead").value,memberIds,teamNote:v("m-teamnote"),scope:v("m-scope"),notes:v("m-notes"),companyId:companyId||null};
  // Se a vertical é nova, regista-a para aparecer na lista no futuro
  if(data.grupo && !allVerticals().includes(data.grupo)){ customVerticals.push(data.grupo); saveSettings(); }
  if(id){ const p=projects.find(x=>x.id===id); const changes=diffProject(p,data); Object.assign(p,data);
    pushLog("Projecto · "+name, changes.length?("Editado: "+changes.join("; ")):"Guardado sem alterações.", id);
    toast("Projecto actualizado."); }
  else { const np={id:uid("p_"),...data}; projects.push(np);
    pushLog("Projecto · "+name,"Projecto criado.",np.id); openProjectId=np.id; view="projects"; toast("Projecto criado."); }
  closeModal(); render(); persist();
}
function diffProject(o,n){
  const labels={name:"nome",grupo:"grupo",priority:"prioridade",leadId:"lead",memberIds:"equipa",teamNote:"equipa (texto)",scope:"âmbito",notes:"notas",companyId:"empresa associada"};
  const out=[]; for(const k in labels){ let ov=o[k],nv=n[k];
    if(k==="leadId"){ ov=personName(ov); nv=personName(nv); }
    if(k==="memberIds"){ ov=(ov||[]).map(personName).filter(Boolean).join(", "); nv=(nv||[]).map(personName).filter(Boolean).join(", "); }
    if(k==="companyId"){ const cn=id=>{const c=coById(id);return c?c.name:"";}; ov=cn(ov); nv=cn(nv); }
    if((ov||"")!==(nv||"")) out.push(`${labels[k]}: «${ov||"—"}» → «${nv||"—"}»`); }
  return out;
}
async function deleteProject(id){
  const p=projects.find(x=>x.id===id); const n=projActions(id).length;
  if(!confirm(`Apagar "${p.name}" e as suas ${n} acção(ões)? Esta operação não pode ser anulada.`)) return;
  actions=actions.filter(a=>a.projectId!==id); projects=projects.filter(x=>x.id!==id);
  pushLog("Projecto · "+p.name,`Projecto e ${n} acção(ões) apagados.`,id);
  closeModal(); openProjectId=null; view="projects"; render(); toast("Projecto apagado."); persist();
}

async function saveAction(id){
  const v=k=>document.getElementById(k).value, vt=k=>v(k).trim();
  const title=vt("m-title"); if(!title){toast("Indique o título da acção.");return;}
  const supSel=document.getElementById("m-asupport");
  const supportIds=supSel?Array.from(supSel.selectedOptions).map(o=>o.value):[];
  const data={title,projectId:v("m-proj"),status:v("m-status"),ownerId:v("m-owner"),supportIds,
    priority:+v("m-aprio"),beginDate:v("m-begin"),deadline:v("m-deadline"),critico:document.getElementById("m-crit").checked,notes:vt("m-anotes")};
  const pName=projName(data.projectId);
  if(id){ const a=actions.find(x=>x.id===id); const changes=diff(a,data,true); Object.assign(a,data);
    pushLog("Acção · "+pName, changes.length?(title+" — "+changes.join("; ")):(title+" — guardada."), id);
    toast("Acção actualizada."); }
  else { const na={id:uid("a_"),...data}; actions.push(na);
    pushLog("Acção · "+pName,"Criada: "+title,na.id); toast("Acção criada."); }
  closeModal(); render(); persist();
}
async function deleteAction(id){
  const a=actions.find(x=>x.id===id); if(!confirm(`Apagar a acção "${a.title}"?`)) return;
  const pName=projName(a.projectId); actions=actions.filter(x=>x.id!==id);
  pushLog("Acção · "+pName,"Apagada: "+a.title,a.projectId);
  closeModal(); render(); toast("Acção apagada."); persist();
}

/* diff for log */
function diff(oldO,newO,isAction){
  const labels=isAction?{title:"título",status:"estado",ownerId:"responsável",priority:"prioridade",deadline:"prazo",beginDate:"início",critico:"crítica",notes:"notas",supportIds:"apoio",projectId:"projecto"}:{name:"nome",grupo:"grupo",priority:"prioridade",lead:"lead",support:"apoio",scope:"âmbito",notes:"notas"};
  const out=[];
  for(const k in labels){
    let ov=oldO[k], nv=newO[k];
    if(k==="status"){ ov=STATUS[ov]?STATUS[ov].label:ov; nv=STATUS[nv]?STATUS[nv].label:nv; }
    if(k==="critico"){ ov=ov?"sim":"não"; nv=nv?"sim":"não"; }
    if(k==="ownerId"){ ov=personName(ov); nv=personName(nv); }
    if(k==="projectId"){ ov=projName(ov); nv=projName(nv); }
    if(k==="supportIds"){ ov=(ov||[]).map(personName).filter(Boolean).join(", "); nv=(nv||[]).map(personName).filter(Boolean).join(", "); }
    if((ov||"")!==(nv||"")) out.push(`${labels[k]}: «${ov||"—"}» → «${nv||"—"}»`);
  }
  return out;
}

function renderKidRows(){

  box.innerHTML=(window._empKids||[]).map((k,i)=>`<div style="display:flex;gap:8px;margin-bottom:6px">
    <input placeholder="Nome" value="${esc(k.name||'')}" oninput="window._empKids[${i}].name=this.value" style="flex:1">

    <button type="button" class="btn xs" onclick="window._empKids.splice(${i},1);renderKidRows()">✕</button>
  </div>`).join("");
}
function addKidRow(){ window._empKids=window._empKids||[]; window._empKids.push({name:"",age:""}); renderKidRows(); }
function handleEmpPhoto(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{ const img=new Image(); img.onload=()=>{
    const max=256, canvas=document.createElement("canvas"); canvas.width=max; canvas.height=max;
    const ctx=canvas.getContext("2d"); const sw=img.width,sh=img.height,ss=Math.min(sw,sh);
    ctx.drawImage(img,(sw-ss)/2,(sh-ss)/2,ss,ss,0,0,max,max);
    window._empPhoto=canvas.toDataURL("image/jpeg",0.82);
    const p=document.getElementById("emp-photo-prev"); if(p){p.style.backgroundImage=`url('${window._empPhoto}')`;p.style.backgroundSize="cover";p.style.backgroundPosition="center";p.textContent="";}
  }; img.src=ev.target.result; };
  reader.readAsDataURL(file);
}
function handleContractPick(input){
  const f=input.files&&input.files[0];
  if(f && f.type!=="application/pdf"){ toast("O contrato tem de ser PDF."); input.value=""; return; }
  _tmpContract=f||null;
  const cur=document.getElementById("emp-contract-cur"); if(cur&&f) cur.textContent="Novo: "+f.name;
}
async function submitEmployee(id){
  const v=k=>{const el=document.getElementById(k);return el?el.value.trim():"";};
  const name=v("emp-name"); if(!name){toast("Indique o nome.");return;}
  const company=v("emp-company"); if(!company){toast("Indique a empresa.");return;}
  const btn=document.getElementById("emp-save-btn"); if(btn){btn.disabled=true;btn.textContent="A guardar…";}
  const kids=(window._empKids||[]).filter(k=>(k.name&&k.name.trim())||(k.age!==""&&k.age!=null));
  const emp={
    name, company, role:v("emp-role"), initials:v("emp-initials"), photo:window._empPhoto||"",
    hire_date:v("emp-hire")||null, contract_duration:v("emp-duration"),
    salary:v("emp-salary"), salary_currency:v("emp-currency"), benefits:v("emp-benefits"),
    manager_id:v("emp-manager")||null, address:v("emp-address"), city:v("emp-city"), province:v("emp-province"),
    dob:v("emp-dob")||null, sex:v("emp-sex"), marital:v("emp-marital"),
    inss:v("emp-inss"), nuit:v("emp-nuit"), children:kids, num_children:kids.length,
    exit_date:v("emp-exit-date")||null, exit_type:v("emp-exit-type"), exit_reason:v("emp-exit-reason")
  };
  if(id) emp.id=id;
  try{
    // 1. Garante uma chave para o ficheiro (usa id existente ou gera um)
    let savedId=id;
    if(!id){ const created=await saveEmployee(emp); savedId=created.id; emp.id=savedId; }
    // 2. Se há contrato novo, faz upload e guarda o caminho
    if(_tmpContract){
      const path=await uploadContract(_tmpContract, savedId);
      emp.contract_path=path;
      await saveEmployee(emp); // grava o caminho
    } else if(id){
      await saveEmployee(emp);
    }
    _tmpContract=null;
    await loadRH();
    closeModal(); openEmpId=savedId; render(); toast("Ficha guardada.");
  }catch(err){
    if(btn){btn.disabled=false;btn.textContent=id?'Guardar':'Criar ficha';}
    toast("Erro: "+(err.message||err));
  }
}
async function confirmDeleteEmp(id){
  const e=employees.find(x=>x.id===id);
  if(!confirm(`Apagar a ficha de ${e.name}? Inclui o contrato anexado. Não pode ser anulado.`)) return;
  try{ await deleteEmployee(id); await loadRH(); closeModal(); openEmpId=null; view="rh"; render(); toast("Ficha apagada."); }
  catch(err){ toast("Erro: "+(err.message||err)); }
}
async function downloadContract(id){
  const e=employees.find(x=>x.id===id); if(!e||!e.contract_path) return;
  try{ const url=await contractUrl(e.contract_path); window.open(url,"_blank"); }
  catch(err){ toast("Erro ao abrir contrato: "+(err.message||err)); }
}

function addContact(){ _tmpContacts=_tmpContacts||[]; _tmpContacts.push({name:"",role:"",phone:"",email:""}); renderContacts(); }
function renderCoDocs(){
  const box=document.getElementById("co-docs-list"); if(!box) return;
  box.innerHTML=(_tmpCoDocs||[]).map((d,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-soft)">
    <span style="font-size:12px">📄 ${esc(d.name)}${d._new?' (novo)':''}</span>
    <button type="button" class="btn xs" onclick="removeCoDocRow(${i})">✕</button></div>`).join("");

function handleCoDocPick(input){
  const f=input.files&&input.files[0]; if(!f) return;
  if(f.type!=="application/pdf"){ toast("Os documentos têm de ser PDF."); input.value=""; return; }
  _tmpCoDocs.push({ name:f.name, _file:f, _new:true });
  input.value="";
  renderCoDocs();
}
function removeCoDocRow(i){
  const d=_tmpCoDocs[i];
  if(d && d.path && !d._new){ d._delete=true; } // marca para apagar do storage ao guardar
  _tmpCoDocs.splice(i,1); renderCoDocs();
}
async function submitCompany(id, kind){
  const v=k=>{const el=document.getElementById(k);return el?el.value.trim():"";};
  const name=v("co-name"); if(!name){toast("Indique o nome.");return;}
  const isGrp = kind==="grupo";
  const btn=document.getElementById("co-save-btn"); if(btn){btn.disabled=true;btn.textContent="A guardar…";}
  const co={ kind:isGrp?"grupo":"externa", name, nuit:v("co-nuit"), sector:v("co-sector"),
    phone:v("co-phone"), email:v("co-email"), website:v("co-website"), address:v("co-address"), notes:v("co-notes") };
  if(isGrp){
    co.founded=v("co-founded")||null;
    co.shareholders=(_tmpShareholders||[]).filter(s=>s.name&&s.name.trim());
  } else {
    co.relation=v("co-relation");
    co.contacts=(_tmpContacts||[]).filter(p=>p.name&&p.name.trim());
  }
  if(id) co.id=id;
  try{
    let savedId=id;
    if(!id){ const created=await saveCompany(co); savedId=created.id; co.id=savedId; }
    if(isGrp){
      // documentos: upload dos novos, remover marcados, manter os restantes
      const finalDocs=[];
      for(const d of _tmpCoDocs){
        if(d._delete){ await removeCompanyDoc(d.path); continue; }
        if(d._new && d._file){ const up=await uploadCompanyDoc(d._file, savedId); finalDocs.push(up); }
        else if(d.path){ finalDocs.push({path:d.path,name:d.name,ts:d.ts}); }
      }
      co.docs=finalDocs;
    }
    await saveCompany(co);
    // Liga/desliga o projecto associado (a relação vive no projecto via companyId)
    const projSel=document.getElementById("co-project");
    if(projSel){
      const chosen=projSel.value;
      let changed=false;
      projects.forEach(p=>{ if(p.companyId===savedId && p.id!==chosen){ p.companyId=null; changed=true; } });
      if(chosen){ const pp=projects.find(p=>p.id===chosen); if(pp && pp.companyId!==savedId){ pp.companyId=savedId; changed=true; } }
      if(changed) persist();
    }
    _tmpCoDocs=[]; _tmpShareholders=[]; _tmpContacts=[];
    await loadCompanies();
    closeModal(); openCoId=savedId; view=isGrp?"grupo":"externas"; render(); toast("Empresa guardada.");
  }catch(err){ if(btn){btn.disabled=false;btn.textContent=id?'Guardar':'Criar';} toast("Erro: "+(err.message||err)); }
}
async function confirmDeleteCo(id){
  const c=coById(id); if(!confirm(`Apagar a empresa "${c.name}"? Inclui documentos anexados. Não pode ser anulado.`)) return;
  try{ await deleteCompany(id); await loadCompanies(); closeModal(); openCoId=null; view=c.kind==="grupo"?"grupo":"externas"; render(); toast("Empresa apagada."); }
  catch(err){ toast("Erro: "+(err.message||err)); }
}
async function downloadCoDoc(path){
  try{ const url=await companyDocUrl(path); window.open(url,"_blank"); }
  catch(err){ toast("Erro ao abrir documento: "+(err.message||err)); }
}

async function saveProfile(uid){
  const b=document.getElementById("prof-body");
  const roleSel=b.querySelector(`[data-ru="${uid}"]`);
  let role=roleSel.value;
  // "perfil" guarda-se como role vazio/neutro (não admin, não leitura)
  const roleVal = role==="admin"?"admin" : role==="leitura"?"leitura" : "perfil";
  const get=area=>b.querySelector(`[data-pu="${uid}"][data-pa="${area}"]`).value;
  const payload={ p_user_id:uid, p_role:roleVal,
    p_projectos:get("projectos"), p_empresas:get("empresas"), p_rh:get("rh") };
  const msg=document.getElementById("prof-msg");
  msg.className="msg show info"; msg.textContent="A guardar…";
  try{
    const { error } = await sb.rpc("set_user_profile", payload);
    if(error) throw error;
    msg.className="msg show ok"; msg.textContent="Perfil guardado.";
  }catch(e){ msg.className="msg show err"; msg.textContent="Erro: "+(e.message||e); }
}

  doc.setTextColor(...navy); doc.setFont("times","bold"); doc.setFontSize(13); doc.text("Acções atrasadas",40,y); y+=6;

  document.querySelectorAll("[data-open-emp]").forEach(el=>el.onclick=()=>{openEmpId=el.getAttribute("data-open-emp");view="rh";render();});
  document.querySelectorAll("[data-open-co]").forEach(el=>el.onclick=()=>{openCoId=el.getAttribute("data-open-co");render();});
  document.querySelectorAll("[data-goto-co]").forEach(el=>el.onclick=async e=>{e.preventDefault();const id=el.getAttribute("data-goto-co");if(!coLoaded)await loadCompanies();const c=coById(id);openProjectId=null;openCoId=id;view=c&&c.kind==="externa"?"externas":"grupo";render();});
  document.querySelectorAll("[data-goto-proj]").forEach(el=>el.onclick=e=>{e.preventDefault();openCoId=null;openProjectId=el.getAttribute("data-goto-proj");view="projects";render();});
  document.querySelectorAll("[data-gantt-toggle]").forEach(el=>el.onclick=e=>{e.stopPropagation();const id=el.getAttribute("data-gantt-toggle");if(ganttExpanded.has(id))ganttExpanded.delete(id);else ganttExpanded.add(id);render();});
  document.querySelectorAll("[data-goto-projbtn]").forEach(el=>el.onclick=e=>{e.stopPropagation();e.preventDefault();openProjectId=el.getAttribute("data-goto-projbtn");view="projects";render();});
}
// Arrastar cartões de projecto para reordenar; ao largar, regrava as prioridades
function setupDragReorder(){
  const grid=document.getElementById("proj-grid"); if(!grid) return;
  grid.querySelectorAll("[data-proj-card]").forEach(card=>{
    card.addEventListener("dragstart",e=>{ card.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
    card.addEventListener("dragend",()=>{ card.classList.remove("dragging"); });
    card.addEventListener("dragover",e=>{ e.preventDefault();
      const dragging=grid.querySelector(".dragging"); if(!dragging||dragging===card) return;
      const rect=card.getBoundingClientRect(); const after=(e.clientY-rect.top)>rect.height/2;
      grid.insertBefore(dragging, after?card.nextSibling:card);
    });
    card.addEventListener("drop",e=>{ e.preventDefault();
      const ids=[...grid.querySelectorAll("[data-proj-card]")].map(c=>c.getAttribute("data-proj-card"));
      ids.forEach((id,i)=>{ const p=projects.find(x=>x.id===id); if(p) p.priority=i+1; });
      persist(); toast("Ordem actualizada.");
    });
  });
}

/* ================= BOOT ================= */
async function boot(){ await loadAll(); await loadSettings(); loadCompanies().then(()=>render()); render(); }

async function startApp(){
  // Cria o cliente Supabase
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  // Já existe sessão activa (ex.: refresh da página)? Entra direto.
  const { data } = await sb.auth.getSession();
  if(data && data.session){
    session = data.session;
    await afterLogin();
  } else {
    showLogin();
  }
}
// Espera a biblioteca do Supabase carregar antes de arrancar
(function waitForSupabase(){
  if(window.supabase && window.supabase.createClient) startApp();
  else setTimeout(waitForSupabase, 60);
})();

// Recarrega do servidor a cada 60s (vê alterações de outras pessoas) e ao voltar ao separador
setInterval(()=>{ if(session && saveState!=="saving" && !document.getElementById("overlay")) refreshFromServer(); }, 60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && session && !document.getElementById("overlay")) refreshFromServer(); });

</script>
